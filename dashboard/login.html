<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your World Changers member dashboard">
    <title>Member Login | World Changers</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>
<body class="dashboard-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1><span class="logo-accent">WORLD</span> CHANGERS</h1>
                <p>Member Portal Login</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>

                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="#" style="font-size: 0.875rem; color: var(--accent-gold);">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Login to Dashboard
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="../pages/apply.html">Apply Now</a></p>
                <p style="margin-top: 1rem;">
                    <a href="../index.html">← Back to Home</a>
                </p>
            </div>

            <!-- Demo Credentials Notice -->
            <div class="demo-notice">
                <h4>Demo Access</h4>
                <p><strong>Member:</strong> member@demo.com / password123</p>
                <p><strong>Mentor:</strong> mentor@demo.com / mentor123</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="../assets/js/login.js"></script>
</body>
</html>
